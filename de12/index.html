        /* =================================
           ヘッダーの動く横線
        ================================= */

        .header-line {

           セクションタイトル

        }

            text-shadow:
                0 0 20px rgba(160, 100, 255, 0.5);

        }


        /* =================================
           ノートカード
        ================================= */

        .note-card {

            position: relative;

            overflow: hidden;

            backdrop-filter: blur(12px);

            transition:

                transform 0.4s ease,

                border-color 0.4s ease,

                background 0.4s ease,

                box-shadow 0.4s ease;

        }

        .note-card > * {

            position: relative;

            z-index: 2;

        }

        .note-card:hover {

            transform:
                translateX(10px) scale(1.015);

            border-color: #a675ff;

            box-shadow:

                0 0 30px rgba(140, 80, 255, 0.3),

                inset 0 0 20px rgba(100, 60, 255, 0.08);

        }

        .note-card:active {

            transform: scale(0.98);

        }


        /* =================================
           カードを横切る光
        ================================= */

        .note-card::before {

            content: "";

            position: absolute;

            inset: 0;

            background:

                linear-gradient(
                    110deg,
                    transparent,
                    rgba(255, 255, 255, 0.15),
                    transparent
                );

            transform: translateX(-100%);

            transition: transform 0.7s ease;

            pointer-events: none;

        }

        .note-card:hover::before {

            transform: translateX(100%);

        }


        /* =================================
           カード内部のマウス追従
        ================================= */

        .note-card::after {

            content: "";

            position: absolute;

            inset: 0;

            background:

                radial-gradient(
                    circle at
                    var(--mouse-x, 50%)
                    var(--mouse-y, 50%),
                    rgba(165, 110, 255, 0.25),
                    transparent 180px
                );

            opacity: 0;

            transition: opacity 0.3s ease;

            pointer-events: none;

        }

        .note-card:hover::after {

            opacity: 1;

        }


        /* =================================
           スクロール時の登場演出
        ================================= */

        .reveal {

            opacity: 0;

            transform: translateY(30px);

            transition:

                opacity 0.8s ease,

                transform 0.8s ease;

        }

        .reveal.visible {

            opacity: 1;

            transform: translateY(0);

        }


        /* =================================
           戻るボタン
        ================================= */

        .back-home {

            position: relative;

            z-index: 3;

            padding: 15px 25px;

            border:
                1px solid rgba(255, 255, 255, 0.2);

            border-radius: 8px;

            background:
                rgba(255, 255, 255, 0.025);

        }

        .back-home:hover {

            border-color: #a35cff;

            color: white;

            box-shadow:
                0 0 20px rgba(140, 80, 255, 0.3);

        }


        /* =================================
           スマートフォン対応
        ================================= */

        @media (max-width: 700px) {

            .note-card:hover {

                transform: translateX(4px);

            }

            .sub-page-title {

                font-size: clamp(30px, 8vw, 45px);

            }

        }


        /* アニメーション軽減設定 */

        @media (prefers-reduced-motion: reduce) {

            .reveal {

                opacity: 1 !important;

                transform: none !important;

                transition: none !important;

            }

        }

    <!-- =================================
         JavaScript
    ================================= -->

    <script>


        // アニメーション設定

        const reducedMotion = window.matchMedia(
            "(prefers-reduced-motion: reduce)"
        );


        // =================================
        // マウスに追従する光
        // =================================

        const mouseLight =
            document.querySelector(".mouse-light");

        document.addEventListener(
            "pointermove",
            function(event) {

                if (
                    reducedMotion.matches ||
                    event.pointerType !== "mouse"
                ) {
                    return;
                }

                mouseLight.style.left =
                    event.clientX + "px";

                mouseLight.style.top =
                    event.clientY + "px";

                mouseLight.style.opacity = "1";

            }
        );

        document.documentElement.addEventListener(
            "pointerleave",
            function() {

                mouseLight.style.opacity = "0";

            }
        );


        // =================================
        // 光の粒子
        // =================================

        const canvas =
            document.getElementById("particles");

        const ctx =
            canvas.getContext("2d");

        let particles = [];

        let animationId = null;


        // 画面サイズ

        function resizeCanvas() {

            canvas.width = window.innerWidth;

            canvas.height = window.innerHeight;

        }

        resizeCanvas();

        window.addEventListener(
            "resize",
            resizeCanvas
        );


        // 粒子を作る

        const particleCount =
            window.innerWidth < 700 ? 30 : 100;

        for (let i = 0; i < particleCount; i++) {

            particles.push({

                x:
                    Math.random() * canvas.width,

                y:
                    Math.random() * canvas.height,

                size:
                    Math.random() * 2 + 0.3,

                speedX:
                    (Math.random() - 0.5) * 0.45,

                speedY:
                    (Math.random() - 0.5) * 0.45,

                opacity:
                    Math.random() * 0.6 + 0.1,

                phase:
                    Math.random() * Math.PI * 2,

                color:
                    Math.random() > 0.5
                        ? "160, 110, 255"
                        : "90, 150, 255"

            });

        }


        // 粒子を動かす

        function animateParticles() {

            ctx.clearRect(
                0, 0,
                canvas.width,
                canvas.height
            );

            if (reducedMotion.matches) {

                animationId = null;

                return;

            }

            particles.forEach(function(particle) {

                particle.x += particle.speedX;

                particle.y += particle.speedY;

                particle.phase += 0.015;


                if (particle.x > canvas.width) {

                    particle.x = 0;

                }

                if (particle.x < 0) {

                    particle.x = canvas.width;

                }

                if (particle.y > canvas.height) {

                    particle.y = 0;

                }

                if (particle.y < 0) {

                    particle.y = canvas.height;

                }


                const brightness =
                    particle.opacity *
                    (0.65 + Math.sin(particle.phase) * 0.35);


                ctx.beginPath();

                ctx.arc(
                    particle.x,
                    particle.y,
                    particle.size,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle =
                    "rgba(" +
                    particle.color +
                    "," +
                    brightness +
                    ")";

                ctx.shadowBlur = 10;

                ctx.shadowColor =
                    "rgb(" + particle.color + ")";

                ctx.fill();

            });

            animationId =
                requestAnimationFrame(animateParticles);

        }


        if (ctx && !reducedMotion.matches) {

            animateParticles();

        }


        // アニメーション設定変更への対応

        reducedMotion.addEventListener(
            "change",
            function() {

                if (!ctx) {

                    return;

                }

                if (reducedMotion.matches) {

                    cancelAnimationFrame(animationId);

                    animationId = null;

                    ctx.clearRect(
                        0, 0,
                        canvas.width,
                        canvas.height
                    );

                    mouseLight.style.opacity = "0";

                } else if (animationId === null) {

                    animateParticles();

                }

            }
        );


        // =================================
        // カード内のマウス追従
        // =================================

        document.querySelectorAll(".note-card").forEach(
            function(card) {

                card.addEventListener(
                    "pointermove",
                    function(event) {

                        if (reducedMotion.matches) {

                            return;

                        }

                        const rect =
                            card.getBoundingClientRect();

                        const x =
                            event.clientX - rect.left;

                        const y =
                            event.clientY - rect.top;

                        card.style.setProperty(
                            "--mouse-x",
                            x + "px"
                        );

                        card.style.setProperty(
                            "--mouse-y",
                            y + "px"
                        );

                    }
                );

            }
        );


        // =================================
        // スクロール時の登場アニメーション
        // =================================

        if (
            !reducedMotion.matches &&
            "IntersectionObserver" in window
        ) {

            const observer =
                new IntersectionObserver(

                    function(entries) {

                        entries.forEach(
                            function(entry) {

                                if (entry.isIntersecting) {

                                    entry.target.classList.add(
                                        "visible"
                                    );

                                    observer.unobserve(
                                        entry.target
                                    );

                                }

                            }
                        );

                    },

                    {
                        threshold: 0.1
                    }

                );


            document.querySelectorAll(
                ".section-heading, .note-list > .note-card, .back-home"
            ).forEach(function(element) {

                element.classList.add("reveal");

                observer.observe(element);

            });

        }


        // =================================
        // ページ切り替え
        // =================================

        let isLeaving = false;

        document.querySelectorAll("a[href]").forEach(
            function(link) {

                link.addEventListener(
                    "click",
                    function(event) {

                        const destination =
                            link.getAttribute("href");

                        if (

                            event.defaultPrevented ||

                            event.button !== 0 ||

                            !destination ||

                            destination.startsWith("#") ||

                            link.origin !== window.location.origin ||

                            link.hasAttribute("download") ||

                            (link.target && link.target !== "_self") ||

                            event.ctrlKey ||

                            event.metaKey ||

                            event.shiftKey ||

                            event.altKey ||

                            reducedMotion.matches

                        ) {

                            return;

                        }

                        event.preventDefault();

                        if (isLeaving) {

                            return;

                        }

                        isLeaving = true;

                        document.body.classList.add(
                            "page-exit"
                        );

                        setTimeout(function() {

                            window.location.href = link.href;

                        }, 350);

                    }
                );

            }
        );


        // ブラウザの戻るボタンへの対応

        window.addEventListener(
            "pageshow",
            function() {

                document.body.classList.remove(
                    "page-exit"
                );

                isLeaving = false;

            }
        );


    </script>

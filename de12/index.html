    <!-- 隠しメニュー -->
    <dialog id="secret-panel">

        <p class="secret-access">ACCESS GRANTED</p>

        <h2 class="secret-heading">SECRET MODE</h2>

        <p class="secret-description">
            隠しコマンドの入力に成功しました。<br>
            カラーテーマを選択してください。
        </p>

        <div class="secret-colors">

            <button class="secret-color-button" data-color="original">
                <span style="--swatch:#a35cff"></span>
                ORIGINAL
            </button>

            <button class="secret-color-button" data-color="ocean">
                <span style="--swatch:#30b8ff"></span>
                OCEAN
            </button>

            <button class="secret-color-button" data-color="crimson">
                <span style="--swatch:#ff426b"></span>
                CRIMSON
            </button>

            <button class="secret-color-button" data-color="gold">
                <span style="--swatch:#d7a84b"></span>
                GOLD
            </button>

            <button class="secret-color-button" data-color="emerald">
                <span style="--swatch:#25cf91"></span>
                EMERALD
            </button>

        </div>

        <button id="secret-close">RETURN</button>

    </dialog>

    <script>

        // カラーテーマの復元

        const body = document.body;
        const panel = document.getElementById("secret-panel");

        const validThemes = [
            "original", "ocean", "crimson", "gold", "emerald"
        ];

        function restoreTheme() {

            try {

                const saved = localStorage.getItem("xbp-secret-theme");

                body.dataset.theme = validThemes.includes(saved)
                    ? saved
                    : "original";

            } catch {

                body.dataset.theme = "original";

            }

        }

        restoreTheme();


        // 隠しコマンド

        const command = [
            "ArrowUp",
            "ArrowUp",
            "ArrowDown",
            "ArrowDown",
            "ArrowLeft",
            "ArrowRight",
            "ArrowLeft",
            "ArrowRight",
            "b",
            "a"
        ];

        let keys = [];

        document.addEventListener("keydown", function(event) {

            if (panel.open || event.repeat ||
                event.ctrlKey || event.altKey || event.metaKey) {
                return;
            }

            keys.push(event.key.toLowerCase());

            keys = keys.slice(-command.length);

            if (
                keys.join(",") ===
                command.join(",").toLowerCase()
            ) {

                keys = [];

                panel.showModal();

            }

        });


        // カラーテーマ変更

        document.querySelectorAll(".secret-color-button")
            .forEach(function(button) {

                button.addEventListener("click", function() {

                    const theme = button.dataset.color;

                    body.dataset.theme = theme;

                    try {
                        localStorage.setItem(
                            "xbp-secret-theme",
                            theme
                        );
                    } catch {}

                    panel.close();

                    keys = [];

                });

            });


        // メニューを閉じる

        document.getElementById("secret-close")
            .addEventListener("click", function() {

                panel.close();

                keys = [];

            });

        panel.addEventListener("close", function() {
            keys = [];
        });


        // マウス追従ライト

        const light = document.querySelector(".mouse-light");

        document.addEventListener("mousemove", function(event) {

            light.style.left = event.clientX + "px";
            light.style.top = event.clientY + "px";
            light.style.opacity = "1";

        });

        document.documentElement.addEventListener("mouseleave", function() {
            light.style.opacity = "0";
        });


        // カードの発光

        document.querySelectorAll(".portfolio-item, .note-card")
            .forEach(function(card) {

                card.addEventListener("mousemove", function(event) {

                    const rect = card.getBoundingClientRect();

                    card.style.setProperty(
                        "--mouse-x",
                        event.clientX - rect.left + "px"
                    );

                    card.style.setProperty(
                        "--mouse-y",
                        event.clientY - rect.top + "px"
                    );

                });

            });


        // クリック時の波紋

        document.addEventListener("click", function(event) {

            if (panel.open || panel.contains(event.target)) {
                return;
            }

            const ripple = document.createElement("div");

            ripple.className = "secret-ripple";

            ripple.style.left = event.clientX + "px";
            ripple.style.top = event.clientY + "px";

            body.appendChild(ripple);

            setTimeout(function() {
                ripple.remove();
            }, 800);

        });


        // 背景の光の粒子

        const canvas = document.getElementById("particles");
        const ctx = canvas.getContext("2d");

        let particles = [];

        function resizeCanvas() {

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            particles = [];

            const count = window.innerWidth < 700 ? 30 : 90;

            for (let i = 0; i < count; i++) {

                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 0.3,
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4,
                    opacity: Math.random() * 0.6 + 0.1
                });

            }

        }

        function animateParticles() {

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const color = getComputedStyle(body)
                .getPropertyValue("--ar").trim();

            particles.forEach(function(p) {

                p.x = (p.x + p.vx + canvas.width) % canvas.width;

                p.y = (p.y + p.vy + canvas.height) % canvas.height;

                ctx.beginPath();

                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);

                ctx.fillStyle = `rgba(${color}, ${p.opacity})`;

                ctx.shadowBlur = 8;
                ctx.shadowColor = `rgb(${color})`;

                ctx.fill();

            });

            requestAnimationFrame(animateParticles);

        }

        resizeCanvas();

        if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
            animateParticles();
        }

        window.addEventListener("resize", resizeCanvas);


        // ページ移動

        document.querySelectorAll("a[href]").forEach(function(link) {

            link.addEventListener("click", function(event) {

                if (event.ctrlKey || event.metaKey ||
                    event.shiftKey || event.altKey ||
                    link.target === "_blank" ||
                    link.origin !== location.origin ||
                    matchMedia("(prefers-reduced-motion: reduce)").matches) {
                    return;
                }

                event.preventDefault();

                body.classList.add("page-exit");

                setTimeout(function() {
                    location.href = link.href;
                }, 350);

            });

        });


        // カラーの共有

        window.addEventListener("pageshow", function() {

            body.classList.remove("page-exit");

            restoreTheme();

            keys = [];

            if (panel.open) {
                panel.close();
            }

        });

        window.addEventListener("storage", function(event) {

            if (event.key === "xbp-secret-theme") {
                restoreTheme();
            }

        });

    </script>
